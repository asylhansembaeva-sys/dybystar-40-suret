}
function current(){const order=shuffledForStage();return order.map(id=>({...items[id],id}));}function place(id,l){if(transitioning||!stages[stage].includes(l))return;let a=Object.keys(placements).filter(k=>placements[k]===l);if(a.length>=1 && !a.includes(String(id)))return;placements[id]=l;selected=null;render();autoComplete()}
function render(){const data=current();$('houses').innerHTML=stages[stage].map(l=>`<div class="house ${l==='У'?'mixed':isV(l)?'vowel':'consonant'}"><div class="roof"></div><div class="letter">${l}</div><div class="housebody"><div class="drop" data-letter="${l}">${data.filter(x=>placements[x.id]===l).map(x=>`<img src="${x.src}" alt="Сурет">`).join('')}</div></div></div>`).join('');document.querySelectorAll('.drop img').forEach(img=>img.onclick=e=>{e.stopPropagation();let data=current().find(x=>x.src===img.getAttribute('src'));if(data&&!transitioning){delete placements[data.id];render()}});document.querySelectorAll('.drop').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');place(e.dataTransfer.getData('text/plain'),el.dataset.letter)};el.onclick=()=>{if(selected!==null)place(selected,el.dataset.letter)}});let available=data.filter(x=>placements[x.id]===undefined);let maxPage=Math.max(0,Math.ceil(available.length/8)-1);page=Math.min(page,maxPage);$('tiles').innerHTML=available.slice(page*8,page*8+8).map(x=>`<div class="tile ${isV(x.letter)?'vowel':''} ${selected===x.id?'selected':''}" draggable="false" data-id="${x.id}" title="Суретті үйшікке апар"><img src="${x.src}" alt="${x.letter}"></div>`).join('');document.querySelectorAll('.tile').forEach(el=>{el.onclick=()=>{if(Date.now()<ignoreClickUntil)return;selected=+el.dataset.id;render()}});$('status').textContent=`${stage+1}-кезең / ${stages.length} · Қалған сурет: ${available.length}`;}

// Сенсорлық экранда және компьютерде сүйрету: құжат деңгейінде бақылау.
let dragging=null,ignoreClickUntil=0;
const tileArea=$('tiles');
function beginDrag(id,x,y,kind){
 if(transitioning)return;
 dragging={id:String(id),x,y,kind,moved:false,ghost:null};
}
function moveDrag(x,y){
 const d=dragging;if(!d)return;
 if(!d.moved&&Math.hypot(x-d.x,y-d.y)<8)return;
 if(!d.moved){
  const source=tileArea.querySelector(`.tile[data-id="${d.id}"] img`);
  if(!source)return;
  d.moved=true;d.ghost=source.cloneNode(true);d.ghost.className='touch-ghost';
  document.body.appendChild(d.ghost);
 }
 d.ghost.style.left=x+'px';d.ghost.style.top=y+'px';
 document.querySelectorAll('.drop.over').forEach(el=>el.classList.remove('over'));
 document.elementFromPoint(x,y)?.closest('.drop')?.classList.add('over');
}
function endDrag(x,y,cancel=false){
 const d=dragging;if(!d)return;dragging=null;
 d.ghost?.remove();document.querySelectorAll('.drop.over').forEach(el=>el.classList.remove('over'));
 if(!d.moved||cancel)return;
 ignoreClickUntil=Date.now()+500;
 const target=document.elementFromPoint(x,y)?.closest('.drop');
 if(target)place(d.id,target.dataset.letter);
 else{selected=+d.id;render()}
}
tileArea.addEventListener('touchstart',e=>{
 const t=e.target.closest('.tile');if(!t||e.touches.length!==1)return;
 const f=e.touches[0];beginDrag(t.dataset.id,f.clientX,f.clientY,'touch');
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!dragging||dragging.kind!=='touch')return;
 if(e.cancelable)e.preventDefault();
 const f=e.touches[0];if(f)moveDrag(f.clientX,f.clientY);
},{passive:false});
document.addEventListener('touchend',e=>{
 if(!dragging||dragging.kind!=='touch')return;
 const f=e.changedTouches[0];if(f)endDrag(f.clientX,f.clientY);
},{passive:false});
document.addEventListener('touchcancel',()=>{if(dragging?.kind==='touch')endDrag(0,0,true)});
tileArea.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'||e.button!==0)return;
 const t=e.target.closest('.tile');if(t)beginDrag(t.dataset.id,e.clientX,e.clientY,'pointer');
});
document.addEventListener('pointermove',e=>{
 if(dragging?.kind==='pointer')moveDrag(e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{
 if(dragging?.kind==='pointer')endDrag(e.clientX,e.clientY);
});
document.addEventListener('pointercancel',()=>{if(dragging?.kind==='pointer')endDrag(0,0,true)});
$('start').onclick=()=>{$('intro').classList.add('hidden');$('game').classList.remove('hidden');render()};$('prev').onclick=()=>{page=Math.max(0,page-1);render()};$('next').onclick=()=>{page++;render()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Дыбыс өшірулі':'🔊 Дыбыс қосулы'};$('reset').onclick=()=>{Object.keys(shuffledOrder).forEach(k=>delete shuffledOrder[k]);stage=0;page=0;selected=null;placements={};$('message').textContent='';$('message').classList.remove('success');transitioning=false;$('game').classList.add('hidden');$('intro').classList.remove('hidden')};function autoComplete(){if(transitioning)return;const data=current();if(!data.every(x=>placements[x.id]===x.letter))return;transitioning=true;audio();fireworks();$('message').textContent='🎉 ЖАРАЙСЫҢ! 🎉';$('message').classList.add('success');setTimeout(()=>{if(stage<stages.length-1){stage++;page=0;placements={};$('message').textContent='';$('message').classList.remove('success');transitioning=false;render()}else{$('message').innerHTML='🏆 ЖАРАЙСЫҢ! БАРЛЫҚ ТАПСЫРМАНЫ ОРЫНДАДЫҢ!<div style="margin-top:16px"><button id="again" style="font-family:Times New Roman,serif;font-weight:bold;font-size:clamp(22px,4vw,36px);background:#ffdc34;color:#122a7d;border:4px solid #fff;border-radius:18px;padding:12px 24px;cursor:pointer">🔄 ҚАЙТАДАН БАСТАУ</button></div>'; $('message').classList.add('success');$('again').onclick=()=>{Object.keys(shuffledOrder).forEach(k=>delete shuffledOrder[k]);stage=0;page=0;selected=null;placements={};transitioning=false;$('message').textContent='';$('message').classList.remove('success');render()}}},2600)}
$('check').onclick=()=>{if(transitioning)return;let data=current();if(data.some(x=>placements[x.id]===undefined)){$('message').textContent='Алдымен барлық суретті үйшіктерге орналастыр!';return}let wrong=data.filter(x=>placements[x.id]!==x.letter);if(wrong.length){wrong.forEach(x=>delete placements[x.id]);$('message').textContent=`${wrong.length} сурет қате орналастырылды. Қайта көр!`;page=0;render();return}autoComplete()};
</script></body></html>
